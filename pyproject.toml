[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsbench-paper-implementation"
version = "0.1.0"
description = "A minimal implementation of the deliberative sentencing workflow described in AgentsBench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentsbench = "agentsbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

